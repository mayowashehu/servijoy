<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-2" y="0" width="204" height="64">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Logo Icon - Stylized S with smile -->
  <g filter="url(#shadow)">
    <path d="M40 15C34.5 15 30 17.5 30 22C30 26.5 34 28 40 29C46 30 50 31.5 50 36C50 40.5 45.5 43 40 43C34.5 43 30 40.5 30 36" 
          stroke="url(#logoGradient)" stroke-width="6" stroke-linecap="round" />
    <path d="M30 36C30 40.5 34.5 45 40 45C45.5 45 50 40.5 50 36" 
          stroke="url(#logoGradient)" stroke-width="6" stroke-linecap="round" />
  </g>
  
  <!-- Servi text -->
  <text x="60" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.025em" fill="url(#logoGradient)">Servi</text>
  
  <!-- Joy text -->
  <text x="125" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.025em" fill="#262626">Joy</text>
  
  <!-- Underline animation -->
  <path d="M60 42h90" stroke="url(#logoGradient)" stroke-width="2" stroke-dasharray="90" stroke-dashoffset="90">
    <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1s" begin="0.5s" fill="freeze" />
  </path>
</svg>